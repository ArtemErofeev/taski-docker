name: Main Taski workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    # Блок services аналогичен docker-compose.yml
    services:
      postgres:
        image: postgres:13.10
        # Указываем имя тестовой базы, имя и пароль пользователя в открытом виде,
        # ведь эта база будет работать только во время прогона тестов
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: <PASSWORD>
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        # Эта конструкция описывает проверку готовности сервиса postgres
        # Если её не будет, то тесты могут запуститься раньше, чем сервер PostgreSQL
        # В результате тесты опять решат, что базы нет, — и упадут
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install flake8==7.3.0 flake8-isort==7.0.0
        pip install -r ./backend/requirements.txt 
    # Этот шаг дополним переменными для доступа к БД
    - name: Test with flake8 and django tests
      # Добавляем env-переменные для доступа к БД
      env:
        POSTGRES_USER: django_user
        POSTGRES_PASSWORD: <PASSWORD>
        POSTGRES_DB: django_db
        # Сервер БД запущен в Docker, но его порт проброшен на хост
        # Поэтому подключаемся к 127.0.0.1:5432
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        python -m flake8 backend/
        cd backend/
        python manage.py test

# Добавляем новую задачу: деплой приложения
  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        # Получение исходного кода из репозитория
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        # Авторизация на Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | \
            docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Build and push backend image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --tag "$DOCKER_USERNAME/taski_backend:latest" \
            ./backend/
          docker push "$DOCKER_USERNAME/taski_backend:latest"
  frontend_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up nodeJS
      # Это готовый воркфлоу для установки Node.js на раннер
      uses: actions/setup-node@v3
      with:
        # Это параметр воркфлоу, указывающий нужную версию Node.js
        node-version: 18

    - name: Install dependencies
      # Эта команда устанавливает зависимости для фронтенда
      run: |
        cd frontend/
        npm ci

    - name: Test frontend
      # Запускаем тесты
      run: |
        cd frontend/
        npm run test
  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | \
            docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Build and push frontend image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --tag "$DOCKER_USERNAME/taski_frontend:latest" \
            ./frontend/
          docker push "$DOCKER_USERNAME/taski_frontend:latest"
  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | \
            docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Build and push gateway image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --tag "$DOCKER_USERNAME/taski_gateway:latest" \
            ./gateway/
          docker push "$DOCKER_USERNAME/taski_gateway:latest"
  deploy:
    runs-on: ubuntu-latest
    needs: 
      # Дождёмся билда всех образов Taski
      - build_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$RUNNER_TEMP/taski_deploy_key"
          chmod 600 "$RUNNER_TEMP/taski_deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/taski_deploy_key" > /dev/null
          ssh-keyscan -H "$DEPLOY_HOST" > "$RUNNER_TEMP/taski_known_hosts"
      # Копируем docker-compose.production.yml на продакшен-сервер
      - name: Copy docker-compose.yml via SSH
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
        run: |
          ssh -T -i "$RUNNER_TEMP/taski_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/taski_known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p taski"
          scp -i "$RUNNER_TEMP/taski_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/taski_known_hosts" \
            docker-compose.production.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:taski/"
      - name: Execute remote SSH commands to deploy
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
        run: |
          ssh -T -i "$RUNNER_TEMP/taski_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/taski_known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
          set -e
          cd taski
          # Выполняет pull образов с Docker Hub
          sudo docker compose -f docker-compose.production.yml pull
          # Перезапускает все контейнеры Docker Compose
          sudo docker compose -f docker-compose.production.yml down
          sudo docker compose -f docker-compose.production.yml up -d
          # Ожидаем, пока PostgreSQL начнёт принимать подключения
          attempt=1
          until sudo docker compose -f docker-compose.production.yml exec -T db \
            sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; do
            if [ "$attempt" -ge 30 ]; then
              echo "PostgreSQL did not become ready in 60 seconds" >&2
              sudo docker compose -f docker-compose.production.yml logs db
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          # Выполняет миграции и сбор статики
          sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
          sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
          sudo docker compose -f docker-compose.production.yml exec -T backend cp -r /app/collected_static/. /backend_static/static/
          EOF
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      env:
        TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      run: |
        curl --fail-with-body --silent --show-error \
          --request POST \
          --url "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_TO}" \
          --data-urlencode "text=Деплой успешно выполнен!"
